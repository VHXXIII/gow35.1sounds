name: VLC skin test
on:
  push:
    branches: [vlc-win11-skin-ci]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        shell: powershell
        run: New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\results", "$env:GITHUB_WORKSPACE\shots" | Out-Null
      - name: Install VLC
        continue-on-error: true
        shell: powershell
        run: ./ci/step1_vlc.ps1 *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\results\step1.log"
      - name: Apply and compare
        continue-on-error: true
        shell: powershell
        run: ./ci/step2_apply.ps1 *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\results\step2.log"
      - name: Install skin and run VLC
        continue-on-error: true
        shell: powershell
        run: ./ci/step3_install.ps1 *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\results\step3.log"
      - name: Uninstall
        continue-on-error: true
        shell: powershell
        run: ./ci/step4_uninstall.ps1 *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\results\step4.log"
      - name: Publish results
        if: always()
        shell: powershell
        run: |
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\shots" "$env:RUNNER_TEMP\shots"
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\results" "$env:RUNNER_TEMP\results"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\results\cmp" | Out-Null
          foreach ($f in 'play_up','pause_hover','thumb_up','seek_fill','shuffle_on_up','stop_hover') {
            foreach ($d in 'out','ref') {
              $src = "$env:GITHUB_WORKSPACE\$d\dark_blue\$f.png"
              if (Test-Path $src) { Copy-Item $src "$env:RUNNER_TEMP\results\cmp\${d}_$f.png" }
            }
          }
          if (Test-Path "$env:GITHUB_WORKSPACE\out") { Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\out\dark_blue\theme.xml" "$env:RUNNER_TEMP\results\dark_blue_theme.xml" }
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git checkout --orphan vlc-skin-ci-results
          git rm -rf . | Out-Null
          Copy-Item -Recurse "$env:RUNNER_TEMP\shots" shots
          Copy-Item -Recurse "$env:RUNNER_TEMP\results" results
          git add shots results
          git commit -m "CI results" | Out-Null
          git push -f origin vlc-skin-ci-results
