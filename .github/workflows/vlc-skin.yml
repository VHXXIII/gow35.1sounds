name: VLC skin test
on:
  push:
    branches: [vlc-win11-skin-ci]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vlc-skin
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        shell: powershell
        run: New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\results", "$env:GITHUB_WORKSPACE\shots" | Out-Null
      - name: Install VLC
        continue-on-error: true
        shell: powershell
        run: ./ci/step1_vlc.ps1 *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\results\step1.log"
      - name: Apply and compare
        continue-on-error: true
        shell: powershell
        run: ./ci/step2_apply.ps1 *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\results\step2.log"
      - name: Install skin and run VLC
        continue-on-error: true
        shell: powershell
        run: ./ci/step3_install.ps1 *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\results\step3.log"
      - name: Mouse test
        continue-on-error: true
        shell: powershell
        run: ./ci/step5_mouse.ps1 *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\results\step5.log"
      - name: Uninstall
        continue-on-error: true
        shell: powershell
        run: ./ci/step4_uninstall.ps1 *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\results\step4.log"
      - name: Publish results
        if: always()
        shell: powershell
        run: |
          $pub = "$env:RUNNER_TEMP\pub"
          New-Item -ItemType Directory -Force "$pub\results\cmp", "$pub\shots" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\results\*" "$pub\results" -Recurse -Force
          Copy-Item "$env:GITHUB_WORKSPACE\shots\*" "$pub\shots" -Recurse -Force
          foreach ($f in 'play_up','pause_hover','thumb_up','seek_fill') {
            foreach ($d in 'out','ref') {
              $src = "$env:GITHUB_WORKSPACE\$d\dark_blue\$f.png"
              if (Test-Path $src) { Copy-Item $src "$pub\results\cmp\${d}_$f.png" }
            }
          }
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git checkout --orphan vlc-skin-ci-results
          git rm -rf . | Out-Null
          Copy-Item "$pub\results" "$env:GITHUB_WORKSPACE\R" -Recurse
          Copy-Item "$pub\shots" "$env:GITHUB_WORKSPACE\S" -Recurse
          git add S R
          git commit -m "CI results" | Out-Null
          git push -f origin vlc-skin-ci-results
